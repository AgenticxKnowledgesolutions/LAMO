# ============================================================
# LAMO - Render blueprint
# ------------------------------------------------------------
# Created during the pre-deployment audit. NOTHING in this file contains a
# credential, database URL, Redis URL or API key. Values marked `sync: false`
# are entered once in the Render dashboard and are stored encrypted there.
#
# IMPORTANT - this blueprint has NOT been deployed or verified. Applying it is
# a manual step (see "Remaining manual Render setup" in the audit report).
#
# Project layout: manage.py lives in ./lamo, so every command cd's into it.
# WSGI module (inspected, lamo/lamo/wsgi.py): lamo.wsgi:application
# ============================================================
services:
  - type: web
    name: lamo
    runtime: python3
    plan: starter          # change/remove to match your Render plan

    # Build: install deps, then collectstatic so WhiteNoise has files to serve.
    # collectstatic runs with DJANGO_ENV unset (development), so it never trips
    # the production SECRET_KEY/CACHE/DEBUG gates during build.
    buildCommand: >-
      python -m pip install -r requirements.txt &&
      cd lamo &&
      python manage.py collectstatic --noinput
    # Migrations are NOT part of startup. They run exactly once per deploy in
    # Render's pre-deploy step (before the new instance is started), instead of
    # on every boot and in every restart. Startup only launches gunicorn.
    # (Pre-deploy commands need a paid instance type; the "starter" plan has them.)
    # If a migration fails, the deploy is aborted and the old version keeps running.
    preDeployCommand: cd lamo && python manage.py migrate --noinput
    startCommand: cd lamo && gunicorn lamo.wsgi --workers 2 --threads 4 --worker-class gthread --log-file -

    # Render's health check: ultra-lightweight endpoint returning 200 OK
    # with 0 database queries, 0 external API calls, and no template rendering.
    healthCheckPath: /health/

    autoDeploy: false       # set to true if you want deploys on git push

    # Persistent disk for local media. Worker KYC/ID proofs (worker_proofs/)
    # are deliberately never sent to Cloudinary, so without this disk they are
    # wiped on every deploy/restart. DJANGO_MEDIA_ROOT (below) points
    # MEDIA_ROOT here. Proofs stay private: urls.py blocks /media/worker_proofs/
    # unconditionally and they are only served by the admin-only
    # proof_download view. Requires a paid instance type (starter or above).
    disk:
      name: lamo-private-media
      mountPath: /var/data
      sizeGB: 1

    envVars:
      # ---- Not secret: safe to keep in this file ----
      - key: DJANGO_ENV
        value: production
      # Off by default; DEBUG is hard-forbidden in production by settings.py.
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_LOG_LEVEL
        value: INFO
      # Public images (services/, workers/, users/) persist on Cloudinary via
      # the prefix-routing default storage backend - Render's disk is
      # ephemeral. Cloudinary is the intended production store, so
      # DJANGO_SERVE_MEDIA is left off. If it is ever set to "True" it serves
      # ONLY the local-disk fallback for those three public prefixes (used when
      # Cloudinary is not configured); worker_proofs/ and every other path are
      # never served from /media/ (see lamo/urls.py).
      - key: DJANGO_SERVE_MEDIA
        value: "False"
      # Content-Security-Policy mode: report-only (default) | enforce | off.
      # Keep report-only until the browser console shows no violations.
      - key: DJANGO_CSP_MODE
        value: report-only
      # Booking reminders/expiry run in the cron service below. After it has run
      # successfully, set this to "False" in the dashboard so web requests stop
      # doing maintenance. Until then the on-request trigger stays as a fallback.
      - key: BOOKING_MAINTENANCE_ON_REQUEST
        value: "True"
      # MEDIA_ROOT on the persistent disk declared above (keeps worker proofs).
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media

      # ---- Secrets: enter the real values in the Render dashboard ----
      # Generate with: python -c "import secrets; print(secrets.token_urlsafe(50))"
      # Render refuses to start the service until these are provided, and
      # settings.py raises ImproperlyConfigured if they are missing/weak.
      - key: DJANGO_SECRET_KEY
        sync: false
      # Secret path for the Django admin site, e.g. a long random string such as
      # "manage-7f3k9x2q". REQUIRED in production: when it is missing the Django
      # admin is simply not mounted (it never falls back to /admin/). Set it in
      # the dashboard BEFORE deploying if you still use /admin/. This is an extra
      # layer only - keep strong passwords (and 2FA, if added) on admin accounts.
      - key: DJANGO_ADMIN_URL
        sync: false
      # External MySQL/MariaDB connection string. Render does NOT create a
      # MySQL instance for you - attach/provision one and paste its URL here.
      # Must be URL-encoded if the password contains @ : /
      - key: DATABASE_URL
        sync: false
      # Shared cache backing the login/OTP/password-reset/AI rate limits.
      # settings.py refuses to start production without it (per-process
      # LocMemCache would silently defeat the lockouts).
      - key: DJANGO_CACHE_URL
        sync: false
      # SMTP (signup OTP, booking mails). Use an app password, not a login.
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Persistent media: public images (services/, workers/, users/) are
      # stored on Cloudinary; worker_proofs/ always stays on local disk.
      # CLOUDINARY_API_SECRET is the credential - never commit it.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Optional: leave blank to disable AI and fall back to local matching.
      - key: GOOGLE_API_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: lamo.agenticx.co.in,lamo-qucn.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://lamo.agenticx.co.in,https://lamo-qucn.onrender.com
      - key: USE_RESEND
        value: "True"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_SENDER
        value: "LAMO <noreply@mail.agenticx.co.in>"
      # SMS provider for phone OTP (sign-up / login / booking verification).
      # Until these are set, phone OTP is reported as unavailable and users
      # are asked to use email; codes are never logged in production.
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false

  # ------------------------------------------------------------------
  # Scheduled booking maintenance (reminders, request expiry, stuck-job
  # follow-ups). Runs every 5 minutes. A cron job is billed per run time, not
  # as an always-on worker. The command is idempotent and takes a shared-cache
  # lock, so overlapping runs (or the on-request fallback) cannot double-send.
  #
  # DASHBOARD STEP REQUIRED: a cron service does not inherit the web service's
  # environment. Give it the SAME values for DJANGO_SECRET_KEY, DATABASE_URL,
  # DJANGO_CACHE_URL (must be the same Redis as the web service, otherwise the
  # lock is not shared), DJANGO_ALLOWED_HOSTS, USE_RESEND / RESEND_API_KEY /
  # RESEND_SENDER and the EMAIL_* / TWILIO_* keys - ideally with a Render
  # Environment Group attached to both services.
  # ------------------------------------------------------------------
  - type: cron
    name: lamo-booking-maintenance
    runtime: python3
    plan: starter
    schedule: "*/5 * * * *"
    buildCommand: python -m pip install -r requirements.txt
    startCommand: cd lamo && python manage.py process_booking_reminders
    envVars:
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: BOOKING_MAINTENANCE_ON_REQUEST
        value: "False"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_CACHE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        value: lamo.agenticx.co.in,lamo-qucn.onrender.com
      - key: USE_RESEND
        value: "True"
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_SENDER
        value: "LAMO <noreply@mail.agenticx.co.in>"
