name: Django CI

on:
  push:
    branches: ['main']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install system libraries for mysqlclient
        run: |
          sudo apt-get update
          sudo apt-get install -y default-libmysqlclient-dev build-essential pkg-config

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system checks
        working-directory: lamo
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
        run: python manage.py check --settings=lamo.settings_test

      - name: Verify migrations are in sync with the models
        working-directory: lamo
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
        run: python manage.py makemigrations --check --dry-run --settings=lamo.settings_test

      - name: Run the test suite (SQLite)
        working-directory: lamo
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-real-secret
        run: python manage.py test --settings=lamo.settings_test --verbosity 2
