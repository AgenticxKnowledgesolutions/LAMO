{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00B050">
  <title>LAMO | Your Services. One Place.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       1. VARIABLES & RESET
       ========================================================= */
    :root {
      --emerald: #00B050;
      --emerald-dark: #087A3E;
      --emerald-deep: #055229;
      --emerald-light: #e6f9ed;
      --light-green: #F0FFF5;
      --white: #FFFFFF;
      --text-dark: #06401f;
      --text-muted: #245839;
      --gold-accent: #ffab00;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--light-green);
    }

    /* =========================================================
       2. FULL-SCREEN BACKGROUND & AMBIENT EFFECTS
       ========================================================= */
    .splash-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 90% 80% at 50% 30%, var(--white) 0%, #ebfaef 35%, #ccf2da 70%, #89dca7 100%);
      overflow: hidden;
      cursor: pointer;
      isolation: isolate;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .splash-container.fade-out {
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
    }

    /* Animated Ambient Wave Curves (Pure CSS) */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(40px);
      pointer-events: none;
      z-index: 1;
      opacity: 0.55;
    }

    .bg-shape-1 {
      top: -15vh;
      right: -10vw;
      width: min(75vw, 650px);
      height: min(75vw, 650px);
      background: radial-gradient(circle, rgba(0, 176, 80, 0.35) 0%, rgba(8, 122, 62, 0.15) 50%, transparent 75%);
      animation: floatShapeOne 12s ease-in-out infinite alternate;
    }

    .bg-shape-2 {
      bottom: -15vh;
      left: -10vw;
      width: min(85vw, 750px);
      height: min(85vw, 750px);
      background: radial-gradient(circle, rgba(0, 214, 98, 0.3) 0%, rgba(240, 255, 245, 0.4) 60%, transparent 80%);
      animation: floatShapeTwo 14s ease-in-out infinite alternate;
    }

    .bg-shape-3 {
      top: 30%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(90vw, 900px);
      height: min(60vw, 550px);
      background: radial-gradient(ellipse, rgba(255, 255, 255, 0.9) 0%, rgba(230, 249, 237, 0.5) 45%, transparent 75%);
      filter: blur(30px);
      z-index: 1;
      animation: pulseSpotlight 6s ease-in-out infinite alternate;
    }

    @keyframes floatShapeOne {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-30px, 40px) scale(1.08); }
    }

    @keyframes floatShapeTwo {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.06); }
    }

    @keyframes pulseSpotlight {
      0% { opacity: 0.7; transform: translate(-50%, -50%) scale(0.95); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    }

    /* Concentric Service Halo Rings */
    .service-ring-system {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(88vw, 680px);
      height: min(88vw, 680px);
      pointer-events: none;
      z-index: 2;
    }

    .concentric-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px dashed rgba(0, 176, 80, 0.22);
      animation: rotateRing 40s linear infinite;
    }

    .concentric-ring.inner {
      inset: 16%;
      border: 1px solid rgba(0, 176, 80, 0.16);
      animation: rotateRingRev 30s linear infinite;
    }

    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateRingRev {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* =========================================================
       3. CENTRAL BRAND HUB
       ========================================================= */
    .brand-hub {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 820px;
      padding: 0 24px;
      text-align: center;
    }

    /* Central Pedestal / Emblem Backplate */
    .emblem-backplate {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -58%);
      width: clamp(240px, 42vw, 360px);
      height: clamp(240px, 42vw, 360px);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.95) 0%, rgba(240, 255, 245, 0.8) 55%, rgba(0, 176, 80, 0.12) 100%);
      box-shadow:
        0 20px 50px rgba(8, 122, 62, 0.12),
        inset 0 2px 6px rgba(255, 255, 255, 0.9),
        inset 0 -4px 14px rgba(0, 176, 80, 0.1);
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      z-index: -1;
      opacity: 0;
      animation: backplateReveal 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) 0.15s forwards;
    }

    @keyframes backplateReveal {
      0% { opacity: 0; transform: translate(-50%, -58%) scale(0.7); }
      100% { opacity: 1; transform: translate(-50%, -58%) scale(1); }
    }

    /* Animated LAMO Wordmark */
    .lamo-wordmark {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: clamp(2px, 0.8vw, 8px);
      margin-bottom: clamp(14px, 2.5vh, 22px);
      user-select: none;
    }

    .lamo-char {
      display: inline-block;
      font-size: clamp(64px, 14vw, 130px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -0.02em;
      opacity: 0;
      transform: translateY(35px) scale(0.85);
      will-change: transform, opacity;
      animation: charAssemble 0.75s cubic-bezier(0.2, 1.2, 0.4, 1) forwards;
    }

    /* Character Individual Stylings & Staggers */
    /* L: White with deep emerald drop-shadow */
    .char-l {
      color: var(--white);
      text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.08),
        0 10px 25px rgba(8, 122, 62, 0.32),
        0 0 40px rgba(0, 176, 80, 0.2);
      -webkit-text-stroke: 1.5px rgba(8, 122, 62, 0.25);
      animation-delay: 0.35s;
    }

    /* A: Vibrant Emerald Green */
    .char-a {
      color: var(--emerald);
      text-shadow:
        0 4px 15px rgba(0, 176, 80, 0.45),
        0 12px 30px rgba(8, 122, 62, 0.25),
        0 0 50px rgba(0, 230, 104, 0.3);
      animation-delay: 0.5s;
    }

    /* M: White with deep emerald drop-shadow */
    .char-m {
      color: var(--white);
      text-shadow:
        0 2px 4px rgba(0, 0, 0, 0.08),
        0 10px 25px rgba(8, 122, 62, 0.32),
        0 0 40px rgba(0, 176, 80, 0.2);
      -webkit-text-stroke: 1.5px rgba(8, 122, 62, 0.25);
      animation-delay: 0.65s;
    }

    /* O: Deep Emerald Green */
    .char-o {
      color: var(--emerald-dark);
      text-shadow:
        0 4px 15px rgba(8, 122, 62, 0.5),
        0 12px 30px rgba(5, 82, 41, 0.28),
        0 0 50px rgba(0, 176, 80, 0.3);
      animation-delay: 0.8s;
    }

    @keyframes charAssemble {
      0% {
        opacity: 0;
        transform: translateY(35px) scale(0.85);
      }
      65% {
        opacity: 1;
        transform: translateY(-6px) scale(1.05);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* Central Subtle Glow Wave Behind Completed Logo */
    .brand-glow-halo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110%;
      height: 90%;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(0, 176, 80, 0.22) 0%, transparent 70%);
      filter: blur(20px);
      z-index: -1;
      opacity: 0;
      animation: glowFadeIn 1s ease 0.9s forwards;
    }

    @keyframes glowFadeIn {
      from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
      to { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
    }

    /* =========================================================
       4. SATELLITE SERVICE ILLUSTRATIONS (INLINE SVG)
       ========================================================= */
    .services-orbit {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }

    .service-badge {
      position: absolute;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 15px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 176, 80, 0.2);
      box-shadow:
        0 10px 24px rgba(8, 122, 62, 0.12),
        0 2px 6px rgba(0, 0, 0, 0.04),
        inset 0 1px 2px rgba(255, 255, 255, 0.9);
      opacity: 0;
      transform: scale(0.7);
      animation: badgeReveal 0.7s cubic-bezier(0.2, 1.2, 0.4, 1) forwards;
      pointer-events: auto;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .service-badge:hover {
      transform: scale(1.06) !important;
      box-shadow: 0 14px 30px rgba(0, 176, 80, 0.25);
    }

    .badge-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(0, 176, 80, 0.15) 0%, rgba(240, 255, 245, 0.8) 100%);
      color: var(--emerald-dark);
      flex-shrink: 0;
    }

    .badge-icon svg {
      width: 17px;
      height: 17px;
      stroke: var(--emerald-dark);
    }

    .badge-text {
      font-size: clamp(11px, 1.4vw, 13px);
      font-weight: 700;
      color: var(--text-dark);
      letter-spacing: 0.2px;
      white-space: nowrap;
    }

    /* Specific Placement of the 4 Service Badges Around Logo */
    /* 1. Home / Construction (Top-Left) */
    .badge-home {
      top: 14%;
      left: 14%;
      animation-delay: 1.1s;
    }
    .badge-home .badge-icon svg {
      stroke: var(--emerald);
    }

    /* 2. Tools / Repairs (Top-Right) */
    .badge-tools {
      top: 16%;
      right: 14%;
      animation-delay: 1.25s;
    }

    /* 3. Electrical (Bottom-Left) */
    .badge-electric {
      bottom: 22%;
      left: 16%;
      animation-delay: 1.4s;
    }
    .badge-electric .badge-icon svg {
      stroke: #d97706; /* warm gold electrical */
      fill: rgba(245, 158, 11, 0.12);
    }

    /* 4. Cleaning / Sparkle (Bottom-Right) */
    .badge-cleaning {
      bottom: 20%;
      right: 16%;
      animation-delay: 1.55s;
    }
    .badge-cleaning .badge-icon svg {
      stroke: var(--emerald);
    }

    @keyframes badgeReveal {
      0% {
        opacity: 0;
        transform: scale(0.65) translateY(15px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Subtle Orbital Floating Motions */
    .badge-home { animation: badgeReveal 0.7s cubic-bezier(0.2, 1.2, 0.4, 1) 1.1s forwards, floatA 4s ease-in-out infinite 1.8s; }
    .badge-tools { animation: badgeReveal 0.7s cubic-bezier(0.2, 1.2, 0.4, 1) 1.25s forwards, floatB 4.4s ease-in-out infinite 1.95s; }
    .badge-electric { animation: badgeReveal 0.7s cubic-bezier(0.2, 1.2, 0.4, 1) 1.4s forwards, floatB 4.2s ease-in-out infinite 2.1s; }
    .badge-cleaning { animation: badgeReveal 0.7s cubic-bezier(0.2, 1.2, 0.4, 1) 1.55s forwards, floatA 4.6s ease-in-out infinite 2.25s; }

    @keyframes floatA {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-7px); }
    }

    @keyframes floatB {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(7px); }
    }

    /* Connecting Energy Dots from Services to Logo */
    .connect-beam {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }

    /* =========================================================
       5. BRAND MESSAGING (TAGLINE & VALUE PROP)
       ========================================================= */
    .brand-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(16px);
      animation: contentReveal 0.8s cubic-bezier(0.2, 0.9, 0.3, 1) 1.65s forwards;
    }

    .brand-tagline {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: clamp(16px, 2.8vw, 24px);
      font-weight: 800;
      color: var(--emerald-dark);
      letter-spacing: -0.01em;
      text-transform: capitalize;
    }

    .brand-tagline-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--emerald);
      box-shadow: 0 0 8px rgba(0, 176, 80, 0.8);
    }

    .brand-description {
      font-size: clamp(12px, 1.8vw, 15px);
      font-weight: 500;
      color: var(--text-muted);
      max-width: 480px;
      line-height: 1.5;
      letter-spacing: 0.1px;
    }

    @keyframes contentReveal {
      0% {
        opacity: 0;
        transform: translateY(16px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================================================
       6. SKIP BUTTON & PROGRESS TIMELINE
       ========================================================= */
    .skip-action {
      position: fixed;
      top: 20px;
      right: 22px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(0, 176, 80, 0.25);
      color: var(--text-dark);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 20px rgba(8, 122, 62, 0.1);
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .skip-action:hover {
      background: var(--white);
      color: var(--emerald);
      border-color: var(--emerald);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 176, 80, 0.2);
    }

    .skip-arrow {
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .skip-action:hover .skip-arrow {
      transform: translateX(3px);
    }

    /* Bottom Linear Progress Track */
    .progress-track {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 3px;
      background: rgba(0, 176, 80, 0.1);
      z-index: 100;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--emerald) 0%, #00d662 60%, var(--emerald-dark) 100%);
      box-shadow: 0 0 10px rgba(0, 176, 80, 0.8);
      transition: width 3.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* =========================================================
       7. MOBILE ADAPTATIONS & ACCESSIBILITY
       ========================================================= */
    @media (max-width: 768px) {
      .badge-home {
        top: 10%;
        left: 6%;
      }
      .badge-tools {
        top: 10%;
        right: 6%;
      }
      .badge-electric {
        bottom: 14%;
        left: 6%;
      }
      .badge-cleaning {
        bottom: 14%;
        right: 6%;
      }
      .service-badge {
        padding: 6px 12px;
      }
      .badge-text {
        font-size: 11px;
      }
      .brand-hub {
        padding: 0 16px;
      }
      .skip-action {
        top: 14px;
        right: 14px;
        padding: 7px 14px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
      .lamo-char, .brand-content, .service-badge, .emblem-backplate {
        opacity: 1 !important;
        transform: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- Main Splash Container -->
  <main class="splash-container" id="splashContainer" role="banner" aria-label="Welcome to LAMO">

    <!-- Ambient Curves & Studio Lighting (CSS) -->
    <div class="bg-shape bg-shape-1"></div>
    <div class="bg-shape bg-shape-2"></div>
    <div class="bg-shape bg-shape-3"></div>

    <!-- Concentric Dotted Service Orbit Rings -->
    <div class="service-ring-system" aria-hidden="true">
      <div class="concentric-ring"></div>
      <div class="concentric-ring inner"></div>
    </div>

    <!-- Skip Button -->
    <a class="skip-action" id="skipButton" href="{% url 'home' %}?from_splash=1" role="button" aria-label="Skip to home page">
      <span>Continue</span>
      <span class="skip-arrow">&#8594;</span>
    </a>

    <!-- Central Brand Stage -->
    <section class="brand-hub">

      <!-- Radial Backdrop Plate -->
      <div class="emblem-backplate" aria-hidden="true"></div>

      <!-- LAMO Wordmark -->
      <div class="lamo-wordmark" aria-label="LAMO">
        <span class="lamo-char char-l">L</span>
        <span class="lamo-char char-a">A</span>
        <span class="lamo-char char-m">M</span>
        <span class="lamo-char char-o">O</span>
        <div class="brand-glow-halo" aria-hidden="true"></div>
      </div>

      <!-- Tagline & Description -->
      <div class="brand-content">
        <h1 class="brand-tagline">
          <span>Your Services</span>
          <span class="brand-tagline-dot" aria-hidden="true"></span>
          <span>One Place</span>
        </h1>
        <p class="brand-description">
          Connecting you with trusted local professionals.
        </p>
      </div>

    </section>

    <!-- 4 Inline SVG Satellite Service Badges (Bringing Services Together) -->
    <div class="services-orbit" aria-hidden="true">

      <!-- 1. Home / Construction -->
      <div class="service-badge badge-home">
        <span class="badge-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 9.5L12 3l9 6.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V9.5z"/>
          </svg>
        </span>
        <span class="badge-text">Home Care</span>
      </div>

      <!-- 2. Tools / Repairs -->
      <div class="service-badge badge-tools">
        <span class="badge-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </span>
        <span class="badge-text">Repairs &amp; Labour</span>
      </div>

      <!-- 3. Electrical & Power -->
      <div class="service-badge badge-electric">
        <span class="badge-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </span>
        <span class="badge-text">Electrical</span>
      </div>

      <!-- 4. Cleaning & Sparkle -->
      <div class="service-badge badge-cleaning">
        <span class="badge-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2l2.4 5.6L20 10l-5.6 2.4L12 18l-2.4-5.6L4 10l5.6-2.4L12 2z"/>
            <path d="M19 17l1 2.5 2.5 1-2.5 1-1 2.5-1-2.5-2.5-1 2.5-1 1-2.5z"/>
          </svg>
        </span>
        <span class="badge-text">Cleaning &amp; Care</span>
      </div>

    </div>

    <!-- Bottom Linear Timeline Progress Bar -->
    <div class="progress-track" aria-hidden="true">
      <div class="progress-bar" id="progressBar"></div>
    </div>

  </main>

  <!-- =========================================================
       SPLASH LIFECYCLE & SEAMLESS HOMEPAGE HANDSHAKE
       ========================================================= -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var container = document.getElementById("splashContainer");
      var progressBar = document.getElementById("progressBar");
      var skipBtn = document.getElementById("skipButton");
      var transitioned = false;

      // Start progress bar animation
      if (progressBar) {
        requestAnimationFrame(function () {
          progressBar.style.width = "100%";
        });
      }

      /*
       * Smooth transition to homepage.
       * Sets browser session storage and lamo_splash_seen cookie so
       * the login popup appears promptly on the homepage and never repeats.
       */
      function proceedToHome() {
        if (transitioned) return;
        transitioned = true;

        if (container) {
          container.classList.add("fade-out");
        }

        try {
          if (window.sessionStorage) {
            sessionStorage.setItem("lamo_splash_seen", "true");
            sessionStorage.setItem("lamo_from_splash", "true");
          }
        } catch (e) { }

        try {
          document.cookie = "lamo_splash_seen=1; path=/; SameSite=Lax";
        } catch (e) { }

        window.setTimeout(function () {
          window.location.replace("{% url 'home' %}?from_splash=1");
        }, 220);
      }

      // Skip button click
      if (skipBtn) {
        skipBtn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          proceedToHome();
        });
      }

      // Tap/click anywhere on screen to proceed immediately
      if (container) {
        container.addEventListener("click", function () {
          proceedToHome();
        });
      }

      // Keyboard navigation: Enter, Space, Escape
      document.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Escape") {
          proceedToHome();
        }
      });

      // Accessibility: if reduced motion is requested, proceed promptly
      var prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var splashDuration = prefersReducedMotion ? 1200 : 3600;

      // Automatic proceed timer
      window.setTimeout(proceedToHome, splashDuration);
    });
  </script>
</body>
</html>
