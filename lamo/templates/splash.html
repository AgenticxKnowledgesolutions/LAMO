{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAMO</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#a9dcbc}
  .scene{position:fixed;inset:0}
  /* soft green backdrop fills the screen, the frame sits in the middle */
  .f{position:absolute;inset:0;opacity:0;transition:opacity .45s ease;display:flex;align-items:center;justify-content:center}
  .f.on{opacity:1}
  .f .bg{position:absolute;inset:0;background:radial-gradient(70% 90% at 50% 45%,#e6f7ec 0%,#a9dcbc 55%,#4aae76 100%)}
  .f img{position:relative;max-width:100%;max-height:100%;height:100%;object-fit:contain;
         transform:scale(1);transition:transform 1.4s ease-out}
  .f.on img{transform:scale(1.04)}
  /* last frame is landscape: fit the width instead */
  .f.wide img{height:auto;width:min(100%,1100px);max-height:100%}
  .brand{position:fixed;left:0;right:0;bottom:7vh;text-align:center;color:#fff;font-family:'Segoe UI',system-ui,sans-serif;
         letter-spacing:.4em;font-size:clamp(11px,2.8vw,15px);text-transform:uppercase;opacity:0;transition:opacity .7s;
         text-shadow:0 2px 14px rgba(0,0,0,.45)}
  .brand.on{opacity:1}
  .skip{position:fixed;top:14px;right:14px;z-index:5;color:#fff;font:600 12px/1 'Segoe UI',system-ui,sans-serif;
        background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:8px 14px;text-decoration:none;
        backdrop-filter:blur(6px)}
  .bar{position:fixed;left:0;bottom:0;height:3px;width:0;background:#22c55e;z-index:5;transition:width linear}
</style>
</head>
<body>
  <a class="skip" id="skipBtn" href="{% url 'home' %}?from_splash=1">Skip</a>
  <div class="scene" id="scene">
    {% for n in "123456" %}
    <div class="f{% if n == '6' %} wide{% endif %}" data-i="{{ n }}">
      <div class="bg"></div>
      <img src="{% static 'img/splash_'|add:n|add:'.webp' %}" alt="LAMO" {% if n != '1' %}loading="eager"{% endif %}>
    </div>
    {% endfor %}
  </div>
  <div class="brand" id="brand">Home services &middot; simplified</div>
  <div class="bar" id="bar"></div>

<script>
  var frames=[].slice.call(document.querySelectorAll('.f')), brand=document.getElementById('brand'), bar=document.getElementById('bar');
  var gaps=[900,800,800,800,800,1900];       // ms each frame stays
  var i=0, total=gaps.reduce(function(a,b){return a+b},0);
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var transitioned=false;
  function go(){
    if(transitioned) return;
    transitioned=true;
    try {
      if(window.sessionStorage){
        sessionStorage.setItem("lamo_splash_seen", "true");
        sessionStorage.setItem("lamo_from_splash", "true");
      }
    } catch(e){}
    try {
      document.cookie = "lamo_splash_seen=1; path=/; SameSite=Lax";
    } catch(e){}
    window.location.replace("{% url 'home' %}?from_splash=1");
  }
  var skipBtn = document.getElementById('skipBtn');
  if(skipBtn){
    skipBtn.addEventListener('click', function(e){
      e.preventDefault();
      go();
    });
  }
  if(reduce){ frames[5].classList.add('on'); brand.classList.add('on'); setTimeout(go,1500); }
  else{
    bar.style.transitionDuration=total+'ms'; requestAnimationFrame(function(){bar.style.width='100%'});
    (function step(){
      frames.forEach(function(f,k){f.classList.toggle('on',k===i)});
      if(i===5) brand.classList.add('on');
      var d=gaps[i]; i++;
      if(i<frames.length) setTimeout(step,d); else setTimeout(go,d);
    })();
  }
</script>
</body>
</html>
