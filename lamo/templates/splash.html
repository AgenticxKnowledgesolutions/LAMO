{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#00140d">

    <title>LAMO | Welcome</title>

    <style>
        /* =========================================
           1. GLOBAL STYLES
        ========================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #00140d;
        }

        /* =========================================
           2. FULL SCREEN DARK GREEN BACKGROUND
        ========================================= */

        .splash-screen {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100vh;
            height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            isolation: isolate;

            background:
                radial-gradient(
                    ellipse at 50% 42%,
                    rgba(0, 110, 62, 0.30) 0%,
                    rgba(0, 49, 31, 0.25) 35%,
                    transparent 70%
                ),
                linear-gradient(
                    135deg,
                    #000d08 0%,
                    #00251a 48%,
                    #000b07 100%
                );

            z-index: 999999;
        }

        /* =========================================
           3. AMBIENT GLOW
        ========================================= */

        .ambient-glow {
            position: absolute;

            width: min(90vw, 900px);
            height: min(70vw, 650px);

            border-radius: 50%;

            background: radial-gradient(
                ellipse,
                rgba(0, 255, 115, 0.12) 0%,
                rgba(255, 146, 25, 0.045) 40%,
                transparent 72%
            );

            filter: blur(35px);

            animation: ambientPulse 3s ease-in-out infinite;

            z-index: -1;
            pointer-events: none;
        }

        @keyframes ambientPulse {
            0%, 100% {
                transform: scale(0.92);
                opacity: 0.65;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        /* =========================================
           4. BACKGROUND PARTICLES
        ========================================= */

        .particles {
            position: absolute;
            inset: 0;

            overflow: hidden;

            pointer-events: none;
        }

        .particle {
            position: absolute;

            display: block;

            width: 3px;
            height: 3px;

            border-radius: 50%;

            background: #42ff89;

            box-shadow:
                0 0 6px #42ff89,
                0 0 14px rgba(66, 255, 137, 0.8);

            opacity: 0;

            animation: particleFloat 2.5s linear infinite;
        }

        .particle.orange {
            background: #ffab38;

            box-shadow:
                0 0 6px #ffab38,
                0 0 14px rgba(255, 171, 56, 0.8);
        }

        @keyframes particleFloat {
            0% {
                transform: translate3d(0, 50px, 0) scale(0.3);
                opacity: 0;
            }

            20% {
                opacity: 0.85;
            }

            70% {
                opacity: 0.7;
            }

            100% {
                transform: translate3d(20px, -120px, 0) scale(1.2);
                opacity: 0;
            }
        }

        /* =========================================
           5. HORIZONTAL LIGHT TRAILS
        ========================================= */

        .light-trails {
            position: absolute;

            width: 150%;
            height: 180px;

            left: -25%;
            top: calc(50% - 70px);

            pointer-events: none;

            opacity: 0;

            animation: trailsAppear 0.8s ease-out 0.25s forwards;
        }

        .trail {
            position: absolute;

            left: 0;
            width: 100%;
            height: 2px;

            border-radius: 50%;

            background: linear-gradient(
                90deg,
                transparent 0%,
                rgba(0, 255, 110, 0.3) 18%,
                #29ff7a 35%,
                #ff9f2e 53%,
                #ffe6a4 65%,
                #ff9f2e 76%,
                transparent 100%
            );

            box-shadow:
                0 0 8px rgba(255, 170, 50, 0.7),
                0 0 20px rgba(0, 255, 110, 0.3);
        }

        .trail-one {
            top: 48px;
            transform: rotate(-5deg);
        }

        .trail-two {
            top: 95px;

            opacity: 0.6;

            transform: rotate(4deg);

            background: linear-gradient(
                90deg,
                transparent,
                rgba(0, 255, 110, 0.7),
                transparent 70%
            );
        }

        @keyframes trailsAppear {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }

            to {
                opacity: 0.9;
                transform: translateX(0);
            }
        }

        /* =========================================
           6. MAIN CONTENT
        ========================================= */

        .splash-content {
            position: relative;
            z-index: 2;

            display: flex;
            flex-direction: column;

            align-items: center;
            justify-content: center;

            width: 100%;
            padding: 24px;
        }

        /* =========================================
           7. LOGO CONTAINER
        ========================================= */

        .logo-container {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: clamp(1px, 0.5vw, 8px);

            min-height: clamp(100px, 18vw, 210px);

            white-space: nowrap;
        }

        /* =========================================
           8. INDIVIDUAL LOGO LETTERS
        ========================================= */

        .logo-letter {
            display: inline-block;

            font-family: Arial, Helvetica, sans-serif;

            font-size: clamp(72px, 13vw, 155px);

            font-weight: 900;

            line-height: 1;

            opacity: 0;

            transform: translateY(-180px) scale(0.8);

            animation:
                ballBounce 0.85s cubic-bezier(0.34, 1.56, 0.64, 1)
                forwards;

            will-change: transform, opacity;
        }

        /* L = WHITE */

        .letter-l {
            color: #ffffff;

            text-shadow:
                0 0 8px rgba(255, 255, 255, 0.8),
                0 0 20px rgba(255, 255, 255, 0.35);

            animation-delay: 0s;
        }

        /* A = ORANGE */

        .letter-a {
            color: #ff9f24;

            text-shadow:
                0 0 8px rgba(255, 159, 36, 0.9),
                0 0 22px rgba(255, 159, 36, 0.65),
                0 0 42px rgba(255, 100, 0, 0.25);

            animation-delay: 0.45s;
        }

        /* M = WHITE */

        .letter-m {
            color: #ffffff;

            text-shadow:
                0 0 8px rgba(255, 255, 255, 0.8),
                0 0 20px rgba(255, 255, 255, 0.35);

            animation-delay: 0.9s;
        }

        /* O = GREEN */

        .letter-o {
            color: #39ff65;

            text-shadow:
                0 0 8px rgba(57, 255, 101, 0.9),
                0 0 22px rgba(57, 255, 101, 0.65),
                0 0 42px rgba(0, 255, 100, 0.35);

            animation-delay: 1.35s;
        }

        /* =========================================
           9. BALL-LIKE BOUNCE ANIMATION
        ========================================= */

        @keyframes ballBounce {

            0% {
                opacity: 0;

                transform:
                    translateY(-180px)
                    scale(0.8, 0.8);
            }

            30% {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1.12, 0.86);
            }

            45% {
                opacity: 1;

                transform:
                    translateY(-55px)
                    scale(0.94, 1.06);
            }

            62% {
                transform:
                    translateY(0)
                    scale(1.07, 0.93);
            }

            76% {
                transform:
                    translateY(-20px)
                    scale(0.98, 1.02);
            }

            88% {
                transform:
                    translateY(0)
                    scale(1.02, 0.98);
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1, 1);
            }
        }

        /* =========================================
           10. SUBTLE FLOOR REFLECTION
        ========================================= */

        .reflection {
            position: absolute;

            left: 50%;
            top: calc(50% + 85px);

            transform: translateX(-50%);

            width: min(70vw, 650px);
            height: 120px;

            background: radial-gradient(
                ellipse,
                rgba(0, 255, 100, 0.12),
                rgba(255, 159, 36, 0.08) 40%,
                transparent 75%
            );

            filter: blur(20px);

            pointer-events: none;
        }

        /* =========================================
           11. LOADING BAR
        ========================================= */

        .loading-container {
            width: min(380px, 75vw);

            margin-top: clamp(30px, 5vh, 50px);
        }

        .loading-track {
            position: relative;

            width: 100%;
            height: 8px;

            overflow: hidden;

            border-radius: 20px;

            border: 1px solid rgba(255, 255, 255, 0.4);

            background: rgba(255, 255, 255, 0.08);

            box-shadow:
                0 0 10px rgba(0, 0, 0, 0.4);
        }

        .loading-progress {
            position: relative;

            width: 0%;
            height: 100%;

            border-radius: inherit;

            background: linear-gradient(
                90deg,
                #ff861a 0%,
                #ffc45b 35%,
                #b8ff58 70%,
                #16ff78 100%
            );

            box-shadow:
                0 0 10px rgba(255, 159, 36, 0.8),
                0 0 20px rgba(0, 255, 100, 0.6);

            animation: progressLoad 2.8s linear forwards;
        }

        @keyframes progressLoad {
            from {
                width: 0%;
            }

            to {
                width: 100%;
            }
        }

        /* =========================================
           12. TAGLINE
        ========================================= */

        .tagline {
            margin-top: 22px;

            color: rgba(255, 255, 255, 0.72);

            font-size: clamp(9px, 1.2vw, 12px);

            font-weight: 500;

            letter-spacing: clamp(2px, 0.5vw, 5px);

            text-align: center;

            opacity: 0;

            animation: taglineAppear 0.6s ease 1.7s forwards;
        }

        @keyframes taglineAppear {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================
           13. EXIT ANIMATION
        ========================================= */

        .splash-screen.fade-out {
            animation: splashExit 0.25s ease forwards;
        }

        @keyframes splashExit {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        /* =========================================
           14. MOBILE RESPONSIVENESS
        ========================================= */

        @media (max-width: 600px) {

            .splash-content {
                padding: 16px;
            }

            .logo-container {
                gap: 0;

                min-height: 100px;
            }

            .logo-letter {
                font-size: clamp(52px, 15vw, 88px);
            }

            .light-trails {
                width: 180%;
                left: -40%;
            }

            .loading-container {
                width: 72vw;
                margin-top: 30px;
            }

            .tagline {
                letter-spacing: 2px;
            }
        }

        /* =========================================
           15. ACCESSIBILITY
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            .ambient-glow,
            .particle,
            .light-trails,
            .trail,
            .logo-letter,
            .loading-progress,
            .tagline {
                animation-duration: 0.01ms !important;
                animation-delay: 0s !important;
            }

            .logo-letter {
                opacity: 1;
                transform: none;
            }

            .loading-progress {
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <!-- =========================================
         LAMO SPLASH SCREEN
    ========================================= -->

    <main class="splash-screen" id="splashScreen">

        <!-- Background glow -->

        <div class="ambient-glow"></div>

        <!-- Background particles -->

        <div
            class="particles"
            id="particles">
        </div>

        <!-- Animated light trails -->

        <div class="light-trails">

            <div class="trail trail-one"></div>

            <div class="trail trail-two"></div>

        </div>

        <!-- Main logo content -->

        <section class="splash-content">

            <!-- LAMO letters -->

            <div class="logo-container">

                <span class="logo-letter letter-l">L</span>

                <span class="logo-letter letter-a">A</span>

                <span class="logo-letter letter-m">M</span>

                <span class="logo-letter letter-o">O</span>

            </div>

            <!-- Floor reflection -->

            <div class="reflection"></div>

            <!-- Loading bar -->

            <div class="loading-container">

                <div class="loading-track">

                    <div
                        class="loading-progress"
                        id="loadingProgress">
                    </div>

                </div>

            </div>

            <!-- Tagline -->

            <p class="tagline">
                LABOUR &amp; SERVICE MANAGEMENT
            </p>

        </section>

    </main>

    <!-- =========================================
         JAVASCRIPT
    ========================================= -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const splash =
                document.getElementById("splashScreen");

            const particlesContainer =
                document.getElementById("particles");

            /*
             * Create floating green and orange particles.
             */

            const particleCount = 50;

            for (let i = 0; i < particleCount; i++) {

                const particle =
                    document.createElement("span");

                particle.classList.add("particle");

                if (Math.random() > 0.5) {
                    particle.classList.add("orange");
                }

                particle.style.left =
                    Math.random() * 100 + "%";

                particle.style.top =
                    (25 + Math.random() * 75) + "%";

                particle.style.animationDelay =
                    Math.random() * 2.5 + "s";

                particle.style.animationDuration =
                    (1.8 + Math.random() * 1.5) + "s";

                const size =
                    (2 + Math.random() * 3) + "px";

                particle.style.width = size;
                particle.style.height = size;

                particlesContainer.appendChild(particle);
            }

            /*
             * IMPORTANT:
             *
             * Replace 'home' below if your actual
             * Django homepage URL has another name.
             */

            const homepageUrl = "{% url 'home' %}";

            /*
             * Start the homepage transition after
             * 3 seconds.
             */

            window.setTimeout(function () {

                splash.classList.add("fade-out");

                try {
                    if (window.sessionStorage) {
                        sessionStorage.setItem("lamo_splash_seen", "true");
                        sessionStorage.setItem("lamo_from_splash", "true");
                    }
                } catch (e) {}

                window.setTimeout(function () {

                    const sep = homepageUrl.indexOf('?') === -1 ? '?' : '&';
                    window.location.replace(homepageUrl + sep + "from_splash=1");

                }, 250);

            }, 3000);

        });

    </script>

</body>
</html>
