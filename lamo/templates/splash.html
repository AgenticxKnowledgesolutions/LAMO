{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a612f">
  <title>LAMO | Your Services. One Place.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       1. VARIABLES & RESET
       ========================================================= */
    :root {
      --emerald-vibrant: #00E668;
      --emerald: #00B050;
      --emerald-dark: #077439;
      --stage-bg: #0a612f;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--stage-bg);
      color: var(--white);
    }

    /* =========================================================
       2. FULL-SCREEN SPLASH CONTAINER & BACKGROUND
       ========================================================= */
    .splash-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, #138745 0%, #0a612f 48%, #054823 82%, #022b15 100%);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s ease, transform 0.4s ease;
      isolation: isolate;
    }

    .splash-container.fade-out {
      opacity: 0;
      transform: scale(1.02);
      pointer-events: none;
    }

    /* =========================================================
       3. FULL-SCREEN VIDEO (NO CARD, NO BORDERS, NO GAPS)
       ========================================================= */
    .splash-video-wrapper {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .splash-video {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      object-fit: cover;
      object-position: center center;
      display: block;
      background: transparent;
      border: none;
      outline: none;
      padding: 0;
      margin: 0;
      border-radius: 0;
    }

    /* Ambient Subtle Vignette Overlay for Depth */
    .viewport-ambient-vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background: radial-gradient(circle at 50% 50%, transparent 60%, rgba(2, 35, 17, 0.35) 100%);
    }

    /* =========================================================
       4. CONTROLS & TIMELINE OVERLAY
       ========================================================= */
    /* Skip / Continue Button */
    .skip-action {
      position: fixed;
      top: 24px;
      right: 28px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
      cursor: pointer;
    }

    .skip-action:hover {
      background: rgba(0, 0, 0, 0.55);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 230, 104, 0.35);
    }

    .skip-arrow {
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .skip-action:hover .skip-arrow {
      transform: translateX(3px);
    }

    /* Bottom Linear Progress Track */
    .progress-track {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.15);
      z-index: 100;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--emerald) 0%, var(--emerald-vibrant) 70%, #FFFFFF 100%);
      box-shadow: 0 0 12px rgba(0, 230, 104, 0.9);
      transition: width 0.15s linear;
    }

    /* =========================================================
       5. RESPONSIVE ADAPTATIONS
       ========================================================= */
    @media (max-width: 768px) {
      .skip-action {
        top: 16px;
        right: 16px;
        padding: 8px 16px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>

  <!-- Full-Screen Splash Container -->
  <main class="splash-container" id="splashContainer" role="banner" aria-label="Welcome to LAMO">

    <!-- Full-Screen Background Video -->
    <div class="splash-video-wrapper">
      <video
        id="splashVideo"
        class="splash-video"
        autoplay
        muted
        playsinline
        preload="auto"
        webkit-playsinline
        x5-playsinline
      >
        <source src="{% static 'video/splash.mp4' %}" type="video/mp4">
        <source src="{% static 'video/splash .mp4' %}" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
      <div class="viewport-ambient-vignette" aria-hidden="true"></div>
    </div>

    <!-- Skip / Continue Button -->
    <a class="skip-action" id="skipButton" href="{% url 'home' %}?from_splash=1" role="button" aria-label="Skip to home page">
      <span>Continue</span>
      <span class="skip-arrow">&#8594;</span>
    </a>

    <!-- Bottom Timeline Progress Track -->
    <div class="progress-track" aria-hidden="true">
      <div class="progress-bar" id="progressBar"></div>
    </div>

  </main>

  <!-- =========================================================
       SPLASH LIFECYCLE, VIDEO SYNC & SEAMLESS REDIRECTION
       ========================================================= */ -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var container = document.getElementById("splashContainer");
      var progressBar = document.getElementById("progressBar");
      var skipBtn = document.getElementById("skipButton");
      var video = document.getElementById("splashVideo");
      var transitioned = false;

      /*
       * Smooth transition to homepage.
       * Sets browser session storage and lamo_splash_seen cookie so
       * the login popup appears promptly on the homepage and never repeats.
       */
      function proceedToHome() {
        if (transitioned) return;
        transitioned = true;

        if (container) {
          container.classList.add("fade-out");
        }

        try {
          if (window.sessionStorage) {
            sessionStorage.setItem("lamo_splash_seen", "true");
            sessionStorage.setItem("lamo_from_splash", "true");
          }
        } catch (e) { }

        try {
          document.cookie = "lamo_splash_seen=1; path=/; SameSite=Lax";
        } catch (e) { }

        window.setTimeout(function () {
          window.location.replace("{% url 'home' %}?from_splash=1");
        }, 220);
      }

      // Skip button click
      if (skipBtn) {
        skipBtn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          proceedToHome();
        });
      }

      // Tap / click anywhere on screen to proceed immediately
      if (container) {
        container.addEventListener("click", function (e) {
          if (e.target.closest("#skipButton")) return;
          proceedToHome();
        });
      }

      // Keyboard navigation: Enter, Space, Escape
      document.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Escape") {
          proceedToHome();
        }
      });

      // Video playback tuning & progress synchronization
      if (video) {
        // Run at 1.15x for a brisk, cinematic pace (~8.5 seconds)
        try {
          video.playbackRate = 1.15;
        } catch (e) { }

        var playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(function (error) {
            console.warn("Autoplay prevented:", error);
          });
        }

        // Synchronize progress bar with video duration
        video.addEventListener("timeupdate", function () {
          if (video.duration && progressBar) {
            var percent = Math.min(100, (video.currentTime / video.duration) * 100);
            progressBar.style.width = percent + "%";
          }
        });

        // Auto-proceed once the video ends
        video.addEventListener("ended", function () {
          if (progressBar) progressBar.style.width = "100%";
          window.setTimeout(proceedToHome, 350);
        });
      }

      // Accessibility: if reduced motion requested, proceed promptly
      var prefersReducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      var maxFallbackDuration = prefersReducedMotion ? 1200 : 9200;

      // Fail-safe automatic timer in case video finishes or fails to fire 'ended'
      window.setTimeout(function () {
        proceedToHome();
      }, maxFallbackDuration);
    });
  </script>
</body>
</html>
