{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#00B050">
  <title>LAMO | Labour &amp; Service Management</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       1. CORE RESET & STUDIO ATMOSPHERE
       ========================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #a9dcbc;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    /* 3D Viewport Stage */
    .studio-stage {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      perspective: 1400px;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 95% 75% at 50% 28%, #ffffff 0%, #e3f8eb 32%, #a8dfbc 68%, #009945 100%);
      isolation: isolate;
      cursor: pointer;
    }

    /* Studio Ambient Overhead Light */
    .studio-spotlight {
      position: absolute;
      top: -15vh;
      left: 50%;
      transform: translateX(-50%);
      width: min(120vw, 1300px);
      height: 75vh;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(255, 255, 255, 0.85) 0%, rgba(255, 255, 255, 0.4) 40%, transparent 75%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 1;
      animation: lightPulse 5s ease-in-out infinite alternate;
    }

    @keyframes lightPulse {
      0% { opacity: 0.75; transform: translateX(-50%) scale(0.98); }
      100% { opacity: 1; transform: translateX(-50%) scale(1.04); }
    }

    /* Ambient Floating Bokeh / Sparks */
    .spark-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 10px #00B050, 0 0 18px rgba(0, 176, 80, 0.8);
      opacity: 0;
      animation: floatUp 3.2s linear infinite;
    }

    .spark.emerald {
      background: #00e668;
      box-shadow: 0 0 12px #00e668, 0 0 20px rgba(0, 230, 104, 0.9);
    }

    @keyframes floatUp {
      0% { transform: translateY(105vh) scale(0.4); opacity: 0; }
      20% { opacity: 0.85; }
      80% { opacity: 0.7; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* =========================================================
       2. CONTINUOUS 3D PLATFORM & FLOOR REFLECTION
       ========================================================= */
    .platform-system {
      position: absolute;
      left: 50%;
      bottom: 6vh;
      transform: translateX(-50%);
      width: min(85vw, 920px);
      height: 180px;
      pointer-events: none;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ground Floor Radial Glow */
    .floor-reflection {
      position: absolute;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse 65% 50% at 50% 60%, rgba(0, 176, 80, 0.45) 0%, rgba(0, 176, 80, 0.15) 50%, transparent 80%);
      filter: blur(24px);
    }

    /* Emerald Platform Rim Pulse (fires on letter placement) */
    .dais-pulse {
      position: absolute;
      width: min(75vw, 680px);
      height: 70px;
      border-radius: 50%;
      border: 2px solid rgba(0, 230, 104, 0.6);
      box-shadow: 0 0 30px rgba(0, 230, 104, 0.7), inset 0 0 20px rgba(0, 230, 104, 0.4);
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dais-pulse.ping {
      animation: daisShockwave 0.65s ease-out forwards;
    }

    @keyframes daisShockwave {
      0% { opacity: 0.9; transform: scale(0.85); }
      50% { opacity: 0.6; transform: scale(1.08); }
      100% { opacity: 0; transform: scale(1.25); }
    }

    /* =========================================================
       3. 3D SCENE FRAMES & KINETIC CHARACTER MOTION
       ========================================================= */
    .scenes-viewport {
      position: relative;
      width: min(92vw, 1200px);
      height: min(82vh, 850px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 4;
      transform-style: preserve-3d;
    }

    .frame-scene {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.42s cubic-bezier(0.25, 0.8, 0.25, 1),
                  transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
      transform: scale(0.96) translateY(12px);
      will-change: transform, opacity;
    }

    .frame-scene.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: scale(1) translateY(0);
    }

    /* Image Wrapper with Studio Framing */
    .character-wrap {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .character-wrap img {
      position: relative;
      max-height: 100%;
      max-width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 20px 35px rgba(0, 70, 32, 0.28))
              drop-shadow(0 8px 16px rgba(0, 0, 0, 0.12));
      transition: transform 1.2s cubic-bezier(0.2, 0.9, 0.3, 1);
      user-select: none;
      -webkit-user-drag: none;
    }

    /* Scene 1: Confident Idle Breathing */
    .frame-scene[data-scene="1"].active .character-wrap img {
      animation: idleBreathe 2.4s ease-in-out infinite alternate;
    }

    @keyframes idleBreathe {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-7px) scale(1.02); }
    }

    /* Scenes 2-5: Dynamic Walking Stride into Center Stage */
    .frame-scene[data-scene="2"] .character-wrap img,
    .frame-scene[data-scene="3"] .character-wrap img,
    .frame-scene[data-scene="4"] .character-wrap img,
    .frame-scene[data-scene="5"] .character-wrap img {
      transform: translateX(-45px) scale(0.97);
    }

    .frame-scene[data-scene="2"].active .character-wrap img,
    .frame-scene[data-scene="3"].active .character-wrap img,
    .frame-scene[data-scene="4"].active .character-wrap img,
    .frame-scene[data-scene="5"].active .character-wrap img {
      animation: walkAndSettle 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes walkAndSettle {
      0% {
        transform: translateX(-45px) translateY(8px) scale(0.97);
      }
      60% {
        transform: translateX(4px) translateY(-4px) scale(1.025);
      }
      100% {
        transform: translateX(0) translateY(0) scale(1.015);
      }
    }

    /* Scene 6: Grand Finale - Camera Push and 3D Logo Shimmer */
    .frame-scene[data-scene="6"] .character-wrap img {
      width: min(100%, 1160px);
      height: auto;
      max-height: 100%;
      transform: scale(0.96);
    }

    .frame-scene[data-scene="6"].active .character-wrap img {
      animation: finaleHeroZoom 2.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    @keyframes finaleHeroZoom {
      0% { transform: scale(0.96) translateY(8px); }
      100% { transform: scale(1.05) translateY(0); }
    }

    /* Shimmer Sweep Overlay on Completed Logo */
    .logo-light-sweep {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: 0;
      mix-blend-mode: overlay;
      background: linear-gradient(
        110deg,
        transparent 20%,
        rgba(255, 255, 255, 0.8) 48%,
        rgba(0, 255, 120, 0.6) 52%,
        transparent 75%
      );
      transform: translateX(-120%);
    }

    .frame-scene[data-scene="6"].active .logo-light-sweep {
      opacity: 1;
      animation: lightStreakSweep 1.6s cubic-bezier(0.22, 1, 0.36, 1) 0.4s forwards;
    }

    @keyframes lightStreakSweep {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }

    /* =========================================================
       4. SEQUENTIAL LETTER ASSEMBLY TRAY (L-A-M-O)
       ========================================================= */
    .letter-assembly-tray {
      position: fixed;
      top: 5vh;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: clamp(8px, 1.8vw, 18px);
      padding: 9px 24px;
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 30px rgba(0, 90, 40, 0.12),
                  inset 0 1px 2px rgba(255, 255, 255, 0.9);
      z-index: 10;
      transition: all 0.4s ease;
    }

    .tray-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: clamp(34px, 6vw, 44px);
      height: clamp(34px, 6vw, 44px);
      border-radius: 12px;
      font-size: clamp(16px, 2.5vw, 22px);
      font-weight: 900;
      letter-spacing: -0.5px;
      color: rgba(0, 90, 45, 0.35);
      background: rgba(255, 255, 255, 0.4);
      border: 1.5px solid rgba(255, 255, 255, 0.6);
      transform: scale(0.9);
      transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* L: Glossy White */
    .tray-pill.pill-l.revealed {
      color: #0f172a;
      background: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.9), 0 4px 12px rgba(0, 0, 0, 0.15);
      transform: scale(1.1);
    }

    /* A: Glossy Emerald Green */
    .tray-pill.pill-a.revealed {
      color: #ffffff;
      background: linear-gradient(135deg, #00B050 0%, #00873d 100%);
      border-color: #00d662;
      box-shadow: 0 0 18px rgba(0, 176, 80, 0.8), 0 4px 12px rgba(0, 70, 30, 0.25);
      transform: scale(1.1);
    }

    /* M: Glossy White */
    .tray-pill.pill-m.revealed {
      color: #0f172a;
      background: #ffffff;
      border-color: #ffffff;
      box-shadow: 0 0 16px rgba(255, 255, 255, 0.9), 0 4px 12px rgba(0, 0, 0, 0.15);
      transform: scale(1.1);
    }

    /* O: Glossy Emerald Green */
    .tray-pill.pill-o.revealed {
      color: #ffffff;
      background: linear-gradient(135deg, #00B050 0%, #00873d 100%);
      border-color: #00d662;
      box-shadow: 0 0 18px rgba(0, 176, 80, 0.8), 0 4px 12px rgba(0, 70, 30, 0.25);
      transform: scale(1.1);
    }

    /* All assembled celebrate pulse */
    .letter-assembly-tray.complete {
      background: rgba(255, 255, 255, 0.85);
      border-color: #00e668;
      box-shadow: 0 12px 35px rgba(0, 176, 80, 0.28);
    }

    /* =========================================================
       5. BRAND TITLE & TAGLINE
       ========================================================= */
    .brand-caption {
      position: fixed;
      bottom: 4.8vh;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .brand-title {
      font-size: clamp(14px, 2.5vw, 18px);
      font-weight: 800;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: #054522;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.8);
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1);
    }

    .brand-sub {
      font-size: clamp(10px, 1.6vw, 13px);
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #0e6e39;
      opacity: 0;
      transform: translateY(6px);
      transition: all 0.6s cubic-bezier(0.2, 0.9, 0.3, 1) 0.15s;
    }

    .brand-caption.visible .brand-title,
    .brand-caption.visible .brand-sub {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================================================
       6. GLASSMORPHISM SKIP BUTTON & PROGRESS TRACKER
       ========================================================= */
    .skip-control {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 9px 18px;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 8px 24px rgba(0, 90, 40, 0.15);
      color: #064e27;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
      cursor: pointer;
    }

    .skip-control:hover {
      background: rgba(255, 255, 255, 0.9);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 90, 40, 0.22);
      color: #00B050;
    }

    .skip-arrow {
      display: inline-block;
      transition: transform 0.2s ease;
      font-size: 14px;
    }

    .skip-control:hover .skip-arrow {
      transform: translateX(3px);
    }

    /* Bottom Linear Timeline Progress Bar */
    .intro-progress-bar {
      position: fixed;
      left: 0;
      bottom: 0;
      height: 4px;
      width: 0%;
      background: linear-gradient(90deg, #00B050 0%, #34d399 50%, #ffffff 100%);
      box-shadow: 0 0 12px rgba(0, 176, 80, 0.9);
      z-index: 25;
      transition: width linear;
    }

    /* Screen Exit Fade-Out Transition */
    .studio-stage.fade-out {
      opacity: 0;
      transform: scale(1.02);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    /* =========================================================
       7. RESPONSIVENESS & ACCESSIBILITY
       ========================================================= */
    @media (max-width: 768px) {
      .scenes-viewport {
        width: 100vw;
        height: 76vh;
      }
      .letter-assembly-tray {
        top: 2.5vh;
        padding: 6px 16px;
      }
      .brand-caption {
        bottom: 3.5vh;
      }
      .skip-control {
        top: 14px;
        right: 14px;
        padding: 7px 14px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .studio-spotlight, .spark, .character-wrap img, .tray-pill {
        animation: none !important;
        transition: none !important;
      }
      .frame-scene {
        transition: opacity 0.1s linear !important;
      }
    }
  </style>
</head>
<body>

  <!-- Studio Stage Background & Interactive Container -->
  <main class="studio-stage" id="studioStage" title="Click anywhere to proceed">

    <!-- Ambient Studio Spotlight -->
    <div class="studio-spotlight"></div>

    <!-- Floating Emerald Spark Field -->
    <div class="spark-field" id="sparkField"></div>

    <!-- Glassmorphism Skip Button -->
    <a class="skip-control" id="skipBtn" href="{% url 'home' %}?from_splash=1" role="button" aria-label="Skip introduction">
      <span>Skip Intro</span>
      <span class="skip-arrow">&#8594;</span>
    </a>

    <!-- Top Assembled Brand Letters Tracker (L-A-M-O) -->
    <nav class="letter-assembly-tray" id="letterTray" aria-label="Brand assembly progress">
      <span class="tray-pill pill-l" id="pillL" title="L">L</span>
      <span class="tray-pill pill-a" id="pillA" title="A">A</span>
      <span class="tray-pill pill-m" id="pillM" title="M">M</span>
      <span class="tray-pill pill-o" id="pillO" title="O">O</span>
    </nav>

    <!-- 3D Platform Dais with Floor Reflection -->
    <div class="platform-system">
      <div class="floor-reflection"></div>
      <div class="dais-pulse" id="daisPulse"></div>
    </div>

    <!-- 6 Animated 3D Story Scenes -->
    <section class="scenes-viewport" id="scenesViewport">

      <!-- Scene 1: Friendly 3D character stands confidently (0 - 1.8s) -->
      <div class="frame-scene active" data-scene="1">
        <div class="character-wrap">
          <img src="{% static 'img/splash_1.webp' %}" alt="LAMO Professional Representative standing confidently">
        </div>
      </div>

      <!-- Scene 2: Character strides forward with glossy white letter 'L' (1.8 - 3.4s) -->
      <div class="frame-scene" data-scene="2">
        <div class="character-wrap">
          <img src="{% static 'img/splash_2.webp' %}" alt="Placing letter L onto platform" loading="eager">
        </div>
      </div>

      <!-- Scene 3: Second character places glossy emerald letter 'A' (3.4 - 5.0s) -->
      <div class="frame-scene" data-scene="3">
        <div class="character-wrap">
          <img src="{% static 'img/splash_3.webp' %}" alt="Placing letter A beside L" loading="eager">
        </div>
      </div>

      <!-- Scene 4: Third character places glossy white letter 'M' (5.0 - 6.6s) -->
      <div class="frame-scene" data-scene="4">
        <div class="character-wrap">
          <img src="{% static 'img/splash_4.webp' %}" alt="Placing letter M beside A" loading="eager">
        </div>
      </div>

      <!-- Scene 5: Fourth character places glossy emerald letter 'O' (6.6 - 8.2s) -->
      <div class="frame-scene" data-scene="5">
        <div class="character-wrap">
          <img src="{% static 'img/splash_5.webp' %}" alt="Placing letter O completing LAMO" loading="eager">
        </div>
      </div>

      <!-- Scene 6: Grand Finale - All 4 members proudly presenting completed LAMO 3D logo (8.2 - 10.5s) -->
      <div class="frame-scene" data-scene="6">
        <div class="character-wrap">
          <img src="{% static 'img/splash_6.webp' %}" alt="LAMO Team proudly presenting completed logo" loading="eager">
          <div class="logo-light-sweep"></div>
        </div>
      </div>

    </section>

    <!-- Brand Caption & Subtitle -->
    <footer class="brand-caption" id="brandCaption">
      <h1 class="brand-title">LAMO</h1>
      <p class="brand-sub">Home Services &middot; Simplified</p>
    </footer>

    <!-- Bottom Linear Progress Bar -->
    <div class="intro-progress-bar" id="progressBar"></div>

  </main>

  <!-- =========================================================
       ANIMATION CONTROLLER & SESSION COORDINATION
       ========================================================= -->
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var scenes = [].slice.call(document.querySelectorAll('.frame-scene'));
      var stage = document.getElementById('studioStage');
      var pulse = document.getElementById('daisPulse');
      var tray = document.getElementById('letterTray');
      var brandCaption = document.getElementById('brandCaption');
      var progressBar = document.getElementById('progressBar');
      var skipBtn = document.getElementById('skipBtn');

      var pillL = document.getElementById('pillL');
      var pillA = document.getElementById('pillA');
      var pillM = document.getElementById('pillM');
      var pillO = document.getElementById('pillO');

      /* Timing sequence for the 6 scenes (in ms):
         Scene 1 (Stand): 1800ms
         Scene 2 (+L):    1600ms
         Scene 3 (+A):    1600ms
         Scene 4 (+M):    1600ms
         Scene 5 (+O):    1600ms
         Scene 6 (Finale): 2600ms
         Total: ~10.8s
      */
      var durations = [1800, 1600, 1600, 1600, 1600, 2600];
      var totalTime = durations.reduce(function (a, b) { return a + b; }, 0);

      var currentSceneIndex = 0;
      var transitioned = false;
      var stepTimeout = null;

      /* Generate floating ambient spark particles */
      var sparkField = document.getElementById('sparkField');
      if (sparkField) {
        for (var s = 0; s < 32; s++) {
          var dot = document.createElement('span');
          dot.className = 'spark' + (Math.random() > 0.45 ? ' emerald' : '');
          dot.style.left = Math.random() * 100 + '%';
          dot.style.animationDelay = Math.random() * 3.5 + 's';
          dot.style.animationDuration = (2.4 + Math.random() * 1.8) + 's';
          var sz = (3 + Math.random() * 3) + 'px';
          dot.style.width = sz;
          dot.style.height = sz;
          sparkField.appendChild(dot);
        }
      }

      /* Trigger platform pulse shockwave ring */
      function triggerPlatformPulse() {
        if (!pulse) return;
        pulse.classList.remove('ping');
        void pulse.offsetWidth; // reflow
        pulse.classList.add('ping');
      }

      /* Smooth transition to homepage */
      function go() {
        if (transitioned) return;
        transitioned = true;
        if (stepTimeout) clearTimeout(stepTimeout);

        if (stage) stage.classList.add('fade-out');

        try {
          if (window.sessionStorage) {
            sessionStorage.setItem("lamo_splash_seen", "true");
            sessionStorage.setItem("lamo_from_splash", "true");
          }
        } catch (e) { }

        try {
          document.cookie = "lamo_splash_seen=1; path=/; SameSite=Lax";
        } catch (e) { }

        setTimeout(function () {
          window.location.replace("{% url 'home' %}?from_splash=1");
        }, 220);
      }

      /* Hook up Skip button */
      if (skipBtn) {
        skipBtn.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          go();
        });
      }

      /* Click or tap anywhere on stage to proceed immediately */
      if (stage) {
        stage.addEventListener('click', function () {
          go();
        });
      }

      /* Keyboard navigation: Space, Enter, or Escape skips to home */
      document.addEventListener('keydown', function (e) {
        if (e.key === ' ' || e.key === 'Enter' || e.key === 'Escape') {
          go();
        }
      });

      /* Prefers Reduced Motion Accessibility Check */
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduceMotion) {
        scenes.forEach(function (sc, idx) {
          sc.classList.toggle('active', idx === 5);
        });
        if (pillL) pillL.classList.add('revealed');
        if (pillA) pillA.classList.add('revealed');
        if (pillM) pillM.classList.add('revealed');
        if (pillO) pillO.classList.add('revealed');
        if (tray) tray.classList.add('complete');
        if (brandCaption) brandCaption.classList.add('visible');
        setTimeout(go, 1800);
        return;
      }

      /* Start Linear Progress Bar */
      if (progressBar) {
        progressBar.style.transitionDuration = totalTime + 'ms';
        requestAnimationFrame(function () {
          progressBar.style.width = '100%';
        });
      }

      /* Scene Orchestrator */
      function renderScene(index) {
        if (transitioned) return;

        scenes.forEach(function (sceneEl, i) {
          sceneEl.classList.toggle('active', i === index);
        });

        // Trigger corresponding visual event per scene
        if (index === 0) {
          // Standing intro
        } else if (index === 1) {
          if (pillL) pillL.classList.add('revealed');
          triggerPlatformPulse();
        } else if (index === 2) {
          if (pillA) pillA.classList.add('revealed');
          triggerPlatformPulse();
        } else if (index === 3) {
          if (pillM) pillM.classList.add('revealed');
          triggerPlatformPulse();
        } else if (index === 4) {
          if (pillO) pillO.classList.add('revealed');
          triggerPlatformPulse();
        } else if (index === 5) {
          // Grand Finale with all 4 letters
          if (tray) tray.classList.add('complete');
          if (brandCaption) brandCaption.classList.add('visible');
          triggerPlatformPulse();
        }

        var delay = durations[index];
        currentSceneIndex++;

        if (currentSceneIndex < scenes.length) {
          stepTimeout = setTimeout(function () {
            renderScene(currentSceneIndex);
          }, delay);
        } else {
          stepTimeout = setTimeout(go, delay);
        }
      }

      // Launch Scene 1
      renderScene(0);
    });
  </script>
</body>
</html>
