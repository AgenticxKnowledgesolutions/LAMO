{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a612f">
  <title>LAMO | Your Services. One Place.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       1. VARIABLES & RESET
       ========================================================= */
    :root {
      --emerald-vibrant: #00E668;
      --emerald: #00B050;
      --stage-bg: #0a612f;
      --white: #FFFFFF;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--stage-bg);
      color: var(--white);
    }

    /* =========================================================
       2. FULL-SCREEN CONTAINER & SEAMLESS GREEN BACKGROUND
       ========================================================= */
    .splash-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, #138745 0%, #0a612f 50%, #054823 85%, #022b15 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    /* =========================================================
       3. RESPONSIVE VIDEO STAGE (FITS SCREEN WITHOUT CROPPING)
       ========================================================= */
    .splash-video-stage {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 1;
    }

    .splash-video {
      width: 100%;
      height: 100%;
      max-width: 100vw;
      max-height: 100vh;
      max-height: 100dvh;
      object-fit: contain;
      object-position: center center;
      display: block;
      background: transparent;
      border: none;
      outline: none;
      margin: 0;
      padding: 0;
    }

    /* =========================================================
       4. SKIP BUTTON & PROGRESS TIMELINE OVERLAY
       ========================================================= */
    .skip-action {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 100;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 30px;
      background: rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: var(--white);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1);
      cursor: pointer;
    }

    .skip-action:hover {
      background: rgba(0, 0, 0, 0.55);
      border-color: rgba(255, 255, 255, 0.6);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(0, 230, 104, 0.35);
    }

    .skip-arrow {
      font-size: 14px;
      transition: transform 0.2s ease;
    }

    .skip-action:hover .skip-arrow {
      transform: translateX(3px);
    }

    /* Bottom Linear Progress Track */
    .progress-track {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      z-index: 100;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--emerald) 0%, var(--emerald-vibrant) 70%, #FFFFFF 100%);
      box-shadow: 0 0 10px rgba(0, 230, 104, 0.8);
      transition: width 0.1s linear;
    }

    @media (max-width: 768px) {
      .skip-action {
        top: 14px;
        right: 14px;
        padding: 7px 14px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

  <!-- Splash Container -->
  <main class="splash-container" id="splashContainer" role="banner" aria-label="Welcome to LAMO">

    <!-- Video Stage -->
    <div class="splash-video-stage">
      <video
        id="splashVideo"
        class="splash-video"
        autoplay
        muted
        playsinline
        preload="auto"
        webkit-playsinline
        x5-playsinline
      >
        <!-- Single responsive video source is injected dynamically by script to avoid loading both -->
        Your browser does not support HTML5 video.
      </video>
    </div>

    <!-- Skip / Continue Button -->
    <a class="skip-action" id="skipButton" href="{% url 'home' %}?from_splash=1" role="button" aria-label="Skip to home page">
      <span>Continue</span>
      <span class="skip-arrow">&#8594;</span>
    </a>

    <!-- Bottom Timeline Progress Track -->
    <div class="progress-track" aria-hidden="true">
      <div class="progress-bar" id="progressBar"></div>
    </div>

  </main>

  <script>
    (function () {
      var video = document.getElementById("splashVideo");
      var progressBar = document.getElementById("progressBar");
      var container = document.getElementById("splashContainer");
      var skipBtn = document.getElementById("skipButton");
      var transitioned = false;

      // Video sources
      var desktopSrc = "{% static 'video/splash.mp4' %}";
      var mobileSrc = "{% static 'video/splash-2.mp4' %}";

      // Detect mobile screen: width <= 768px or portrait phone/tablet
      var isMobile = (window.innerWidth <= 768) || 
                     (window.matchMedia && window.matchMedia("(max-width: 768px)").matches) ||
                     (window.matchMedia && window.matchMedia("(orientation: portrait) and (max-width: 900px)").matches);

      // Select single video based on screen size (avoids loading both simultaneously)
      var activeSrc = isMobile ? mobileSrc : desktopSrc;

      /*
       * Immediate transition to homepage.
       * Sets session tracking so the user is not shown the splash repeatedly.
       */
      function proceedToHome() {
        if (transitioned) return;
        transitioned = true;

        try {
          if (window.sessionStorage) {
            sessionStorage.setItem("lamo_splash_seen", "true");
            sessionStorage.setItem("lamo_from_splash", "true");
          }
        } catch (e) { }

        try {
          document.cookie = "lamo_splash_seen=1; path=/; SameSite=Lax";
        } catch (e) { }

        // Immediately transition without artificial delays or trailing green screen
        window.location.replace("{% url 'home' %}?from_splash=1");
      }

      if (video) {
        // Set single source directly
        video.src = activeSrc;
        video.load();

        // When the selected video finishes, immediately transition to home (plays only once)
        video.addEventListener("ended", function () {
          proceedToHome();
        });

        // Synchronize timeline progress bar
        video.addEventListener("timeupdate", function () {
          if (video.duration && progressBar) {
            var percent = Math.min(100, (video.currentTime / video.duration) * 100);
            progressBar.style.width = percent + "%";
          }
        });

        // Fail-safe: if video fails to load, proceed immediately so user is not stuck
        video.addEventListener("error", function () {
          proceedToHome();
        });

        // Autoplay handling
        var playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(function (error) {
            // Autoplay blocked by browser policy; proceed to home gracefully
            console.warn("Autoplay blocked:", error);
            proceedToHome();
          });
        }
      } else {
        proceedToHome();
      }

      // Tap / click anywhere on screen to proceed immediately
      if (container) {
        container.addEventListener("click", function (e) {
          if (e.target.closest("#skipButton")) return;
          proceedToHome();
        });
      }

      // Skip button
      if (skipBtn) {
        skipBtn.addEventListener("click", function (e) {
          e.preventDefault();
          e.stopPropagation();
          proceedToHome();
        });
      }

      // Keyboard navigation
      document.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Escape") {
          proceedToHome();
        }
      });

      // Fail-safe maximum timeout (11s) in case events are completely stalled
      window.setTimeout(function () {
        proceedToHome();
      }, 11000);
    })();
  </script>
</body>
</html>
