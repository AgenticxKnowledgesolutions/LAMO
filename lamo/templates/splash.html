<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LAMO</title>
<style>
  :root { --green:#22c55e; --bg1:#07130d; --bg2:#0f2a1b; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 40%, var(--bg2), var(--bg1) 70%);
    font-family: 'Segoe UI', system-ui, sans-serif;
    cursor: pointer;
    user-select: none;
  }
  .logo { display:flex; gap:clamp(4px,1.5vw,14px); }
  .logo span {
    font-size: clamp(64px, 18vw, 150px);
    font-weight: 800; line-height:1; color:#fff;
    opacity:0; will-change: transform, opacity;
    text-shadow: 0 8px 30px rgba(34,197,94,.25);
  }
  /* L and M come from the left, A and O from the right */
  .logo span:nth-child(1){ animation: fromLeft  .9s .2s  forwards; }
  .logo span:nth-child(2){ animation: fromRight .9s .6s  forwards; color: var(--green); }
  .logo span:nth-child(3){ animation: fromLeft  .9s 1.0s forwards; }
  .logo span:nth-child(4){ animation: fromRight .9s 1.4s forwards; color: var(--green); }

  @keyframes fromLeft {
    0%   { transform: translateX(-110vw) rotate(-20deg); opacity:0; }
    55%  { transform: translateX(14px)   rotate(4deg);   opacity:1; }
    72%  { transform: translateX(-9px)   rotate(-2deg); }
    86%  { transform: translateX(4px);  }
    100% { transform: translateX(0)      rotate(0);      opacity:1; }
  }
  @keyframes fromRight {
    0%   { transform: translateX(110vw)  rotate(20deg);  opacity:0; }
    55%  { transform: translateX(-14px)  rotate(-4deg);  opacity:1; }
    72%  { transform: translateX(9px)    rotate(2deg); }
    86%  { transform: translateX(-4px); }
    100% { transform: translateX(0)      rotate(0);      opacity:1; }
  }
  /* small hop of the whole word after all letters landed */
  .logo { animation: hop .6s 2.3s ease-out; }
  @keyframes hop { 0%,100%{transform:translateY(0)} 40%{transform:translateY(-14px)} 70%{transform:translateY(3px)} }

  .tag {
    margin-top: 18px; color:#bbf7d0; letter-spacing:.35em; font-size:clamp(11px,2.8vw,15px);
    text-transform:uppercase; opacity:0; animation: fade .8s 2.4s forwards;
  }
  .bar { width:min(220px,50vw); height:3px; margin-top:26px; background:rgba(255,255,255,.12);
         border-radius:3px; overflow:hidden; opacity:0; animation: fade .4s 2.4s forwards; }
  .bar i { display:block; height:100%; width:0; background:var(--green);
           animation: load 1s 2.5s ease-out forwards; }
  @keyframes fade { to { opacity:1; } }
  @keyframes load { to { width:100%; } }

  @media (prefers-reduced-motion: reduce) {
    .logo span, .logo, .tag, .bar { animation:none !important; opacity:1 !important; }
  }
</style>
</head>
<body>
  <div class="logo" aria-label="LAMO">
    <span>L</span><span>A</span><span>M</span><span>O</span>
  </div>
  <div class="tag">Home services, simplified</div>
  <div class="bar"><i></i></div>

  <script>
    (function () {
      var transitioned = false;
      function proceedToHome() {
        if (transitioned) return;
        transitioned = true;
        try {
          if (window.sessionStorage) {
            sessionStorage.setItem("lamo_splash_seen", "true");
            sessionStorage.setItem("lamo_from_splash", "true");
          }
        } catch (e) { }

        try {
          document.cookie = "lamo_splash_seen=1; path=/; SameSite=Lax";
        } catch (e) { }

        window.location.replace("{% url 'home' %}?from_splash=1");
      }

      setTimeout(proceedToHome, 3700);

      document.addEventListener("click", proceedToHome);
      document.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " " || e.key === "Escape") {
          proceedToHome();
        }
      });
    })();
  </script>
</body>
</html>
