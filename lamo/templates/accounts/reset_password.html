{% extends 'base.html' %}
{% block title %}Reset Password - LAMO{% endblock %}
{% block content %}
<style>
.rp-container {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
}
.rp-card {
    background: #fff;
    border-radius: 20px;
    padding: 48px 40px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.08);
    text-align: center;
}
.rp-icon {
    width: 70px;
    height: 70px;
    background: linear-gradient(135deg, #10b981, #059669);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 28px;
    color: #fff;
}
.rp-card h2 { font-size: 24px; font-weight: 700; margin-bottom: 8px; color: #1e293b; }
.rp-card p { color: #64748b; margin-bottom: 28px; font-size: 14px; }
.rp-input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid #e2e8f0;
    border-radius: 12px;
    font-size: 15px;
    margin-bottom: 16px;
    outline: none;
    transition: border-color 0.2s;
}
.rp-input:focus { border-color: #10b981; }
.rp-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
}
.rp-btn:hover { opacity: 0.9; }
@media (max-width: 480px) {
    .rp-card { padding: 32px 20px; }
}
</style>
<div class="rp-container">
    <div class="rp-card">
        <div class="rp-icon"><i class="bi bi-shield-lock"></i></div>
        <h2>Reset Password</h2>
        <p>Enter your new password below.</p>

        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'reset_password' token=token %}">
            {% csrf_token %}
            <input type="password" name="password" class="rp-input" placeholder="New password (min 8 chars)" required minlength="8">
            <input type="password" name="confirm_password" class="rp-input" placeholder="Confirm new password" required>
            <button type="submit" class="rp-btn">Reset Password</button>
        </form>
    </div>
</div>
{% endblock %}
