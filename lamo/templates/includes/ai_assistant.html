  <!-- =========================================================
       AI SERVICE ASSISTANT WIDGET
  ========================================================= -->
  <style>
    #ai-chat-box {
      width: 360px;
      max-width: 92vw;
      background: rgba(255, 255, 255, 0.95) !important;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 20px !important;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.16) !important;
      border: 1px solid rgba(8, 127, 91, 0.18) !important;
      overflow: hidden;
    }

    .ai-query-chips-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .ai-chip-btn {
      border: 1px solid #d1fae5;
      background: #f0fdf4;
      color: #065f46;
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
      font-family: inherit;
    }

    .ai-chip-btn:hover {
      background: #087f5b;
      color: #ffffff;
      border-color: #087f5b;
      transform: translateY(-1px);
    }

    .ai-typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 4px;
    }

    .ai-typing-dot {
      width: 6px;
      height: 6px;
      background: #10b981;
      border-radius: 50%;
      animation: aiDotPulse 1.2s infinite ease-in-out;
    }

    .ai-typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .ai-typing-dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes aiDotPulse {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    @media (max-width: 600px) {
      #ai-assistant-widget {
        bottom: 18px !important;
        right: 18px !important;
      }
      #ai-assistant-toggle {
        width: 48px !important;
        height: 48px !important;
        font-size: 20px !important;
      }
      #ai-chat-box {
        width: calc(100vw - 36px) !important;
        max-width: 350px !important;
        bottom: 62px !important;
        right: 0 !important;
      }
    }
  </style>
  <div id="ai-assistant-widget" style="position: fixed; bottom: 25px; right: 25px; z-index: 9999;">
    <button id="ai-assistant-toggle" title="AI Service Matcher" aria-label="Open AI Service Matcher" aria-expanded="false" aria-controls="ai-chat-box" style="width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #087f5b 0%, #056b4d 100%); color: white; border: none; box-shadow: 0 8px 24px rgba(8,127,91,0.35); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: transform 0.3s ease;">
      <i class="bi bi-robot"></i>
    </button>

    <div id="ai-chat-box" role="dialog" aria-modal="false" aria-label="AI Service Matcher" style="display: none; position: absolute; bottom: 70px; right: 0; overflow: hidden; flex-direction: column;">
      <div style="background: linear-gradient(135deg, #064e3b 0%, #087f5b 100%); color: white; padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <i class="bi bi-magic" style="font-size: 18px; color: #6ee7b7;"></i>
          <div>
            <strong style="font-size: 14px; display: block; line-height: 1.2;">AI Service Matcher</strong>
            <small style="font-size: 10.5px; opacity: 0.85; display: inline-flex; align-items: center; gap: 4px;">
              <span style="width: 6px; height: 6px; border-radius: 50%; background: #34d399; display: inline-block;"></span> Online • Ready to match
            </small>
          </div>
        </div>
        <button id="ai-chat-close" aria-label="Close AI Service Matcher" style="background: rgba(255,255,255,0.15); border: none; color: white; width: 28px; height: 28px; border-radius: 50%; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center;"><i class="bi bi-x-lg"></i></button>
      </div>

      <div id="ai-messages" style="padding: 15px; height: 280px; overflow-y: auto; font-size: 13px; display: flex; flex-direction: column; gap: 10px; background: #f8fafc;">
        <div style="background: white; padding: 12px 14px; border-radius: 14px; border: 1px solid #e2e8f0; color: #374151; box-shadow: 0 1px 4px rgba(0,0,0,0.03);">
          👋 Hi! What work do you need done?
          <div class="ai-query-chips-row">
            <button type="button" class="ai-chip-btn" data-query="Need an electrician for wiring repair">⚡ Electrician</button>
            <button type="button" class="ai-chip-btn" data-query="Plumber needed for leaking tap">🔧 Plumbing</button>
            <button type="button" class="ai-chip-btn" data-query="AC repair and servicing">❄️ AC Repair</button>
            <button type="button" class="ai-chip-btn" data-query="House deep cleaning">🧹 Cleaning</button>
          </div>
        </div>
      </div>

      <div style="padding: 12px; border-top: 1px solid #e2e8f0; background: white; display: flex; gap: 8px; align-items: center;">
        <input type="text" id="ai-input" aria-label="Ask about a service" placeholder="Type your need..." style="flex: 1; border-radius: 12px; border: 1.5px solid #cbd5e1; padding: 9px 14px; font-size: 13px; outline: none; transition: border-color 0.2s;" onfocus="this.style.borderColor='#087f5b'" onblur="this.style.borderColor='#cbd5e1'">
        <button id="ai-send" aria-label="Send message to AI Matcher" style="background: #087f5b; color: white; border: none; border-radius: 12px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 2px 8px rgba(8,127,91,0.25);">
          <i class="bi bi-send-fill" style="font-size: 14px;"></i>
        </button>
      </div>
    </div>
  </div>

  <script>
  document.addEventListener('DOMContentLoaded', function() {
    const toggle = document.getElementById('ai-assistant-toggle');
    const chatBox = document.getElementById('ai-chat-box');
    const closeBtn = document.getElementById('ai-chat-close');
    const sendBtn = document.getElementById('ai-send');
    const input = document.getElementById('ai-input');
    const messages = document.getElementById('ai-messages');

    /* Every element must exist before any listener is attached, otherwise the
       rest of the widget is skipped instead of throwing halfway through. */
    if (!toggle || !chatBox || !closeBtn || !sendBtn || !input || !messages) {
      return;
    }

    const currentUserDistrict = "{{ request.user.user_profile.district|default:''|escapejs }}";
    const assistantUrl = "{% url 'ai_service_assistant' %}";
    /* Placeholder id is swapped for the real service id by serviceDetailUrl(). */
    const serviceUrlPattern = "{% url 'service_detail' 999999 %}";
    const csrfToken = "{{ csrf_token }}";
    const LOCATION_STORAGE_KEY = 'lamo_ai_user_location';

    toggle.addEventListener('click', function() {
      const willOpen = chatBox.style.display === 'none';
      chatBox.style.display = willOpen ? 'flex' : 'none';
      toggle.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
      if (willOpen) {
        input.focus();
      }
    });

    closeBtn.addEventListener('click', function() {
      chatBox.style.display = 'none';
      toggle.setAttribute('aria-expanded', 'false');
      toggle.focus();
    });

    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && chatBox.style.display !== 'none') {
        chatBox.style.display = 'none';
        toggle.setAttribute('aria-expanded', 'false');
        toggle.focus();
      }
    });

    /* Server/database values are always escaped before they reach innerHTML -
       the AI reply is the only markup built by this widget. */
    function escapeHtml(value) {
      const div = document.createElement('div');
      div.textContent = (value === null || value === undefined) ? '' : String(value);
      return div.innerHTML;
    }

    function serviceDetailUrl(serviceId) {
      return serviceUrlPattern.replace('999999', encodeURIComponent(serviceId));
    }

    function createBubble(isUser) {
      const msgDiv = document.createElement('div');
      msgDiv.style.padding = '10px 14px';
      msgDiv.style.borderRadius = '12px';
      msgDiv.style.maxWidth = '85%';
      if (isUser) {
        msgDiv.style.background = '#16a34a';
        msgDiv.style.color = 'white';
        msgDiv.style.alignSelf = 'flex-end';
      } else {
        msgDiv.style.background = 'white';
        msgDiv.style.color = '#374151';
        msgDiv.style.border = '1px solid #e5e7eb';
        msgDiv.style.alignSelf = 'flex-start';
      }
      return msgDiv;
    }

    function appendMessage(text, isUser = false) {
      const msgDiv = createBubble(isUser);
      /* textContent, not innerHTML: user input and AI text stay plain text. */
      msgDiv.textContent = (text === null || text === undefined) ? '' : String(text);
      messages.appendChild(msgDiv);
      messages.scrollTop = messages.scrollHeight;
    }

    function appendMarkup(html) {
      const msgDiv = createBubble(false);
      msgDiv.innerHTML = html;
      messages.appendChild(msgDiv);
      messages.scrollTop = messages.scrollHeight;
    }

    function appendLoading() {
      const loadingMessage = createBubble(false);
      loadingMessage.dataset.loading = 'true';
      loadingMessage.innerHTML = '<div class="ai-typing-indicator"><span class="ai-typing-dot"></span><span class="ai-typing-dot"></span><span class="ai-typing-dot"></span><span style="font-size:11.5px; margin-left:6px; color:#64748b; font-weight:600;">Matching verified services...</span></div>';
      messages.appendChild(loadingMessage);
      messages.scrollTop = messages.scrollHeight;
      return loadingMessage;
    }

    function removeLoading(node) {
      if (node && node.parentNode) {
        node.parentNode.removeChild(node);
      } else {
        const fallback = messages.querySelector('[data-loading="true"]');
        if (fallback) fallback.remove();
      }
    }

    function readStoredLocation() {
      try {
        const stored = localStorage.getItem(LOCATION_STORAGE_KEY);
        if (!stored) return null;
        const parsed = JSON.parse(stored);
        if (parsed && typeof parsed.lat === 'number' && typeof parsed.lng === 'number') {
          return { lat: parsed.lat, lng: parsed.lng };
        }
      } catch (error) {
        /* localStorage can be unavailable (private mode) or hold bad JSON. */
      }
      return null;
    }

    function resolveLocation() {
      const stored = readStoredLocation();
      if (stored || !navigator.geolocation) {
        return Promise.resolve(stored);
      }
      return new Promise(function(resolve) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            const location = { lat: position.coords.latitude, lng: position.coords.longitude };
            try {
              localStorage.setItem(LOCATION_STORAGE_KEY, JSON.stringify(location));
            } catch (error) {
              /* Storing the location is best-effort only. */
            }
            resolve(location);
          },
          function() {
            resolve(readStoredLocation());
          },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 }
        );
      });
    }

    /* Builds the bot bubble markup. Every value that originates from the
       database (service, worker names, districts, labels) is escaped. */
    function buildReplyHtml(service, workers) {
      let reply = `<strong>Matched Service: ${escapeHtml(service.name)}</strong><br>${escapeHtml(service.description || '')}`;
      if (service.price) {
        reply += `<br><em>Estimated Price: &#8377;${escapeHtml(service.price)}</em>`;
      }

      if (workers && workers.length > 0) {
        reply += `<br><br><strong>Available Workers:</strong><ul style="margin: 4px 0; padding-left: 18px;">`;
        workers.forEach(function(w) {
          const distanceText = w.distance_label ? ` - ${escapeHtml(w.distance_label)}` : '';
          reply += `<li>${escapeHtml(w.name)} (${escapeHtml(w.district || 'Local')})${distanceText} - Rating: ${escapeHtml(w.rating || 'New')}</li>`;
        });
        reply += `</ul>`;
      }

      reply += `<br><a href="${serviceDetailUrl(service.id)}" style="color: #16a34a; font-weight: 600; text-decoration: underline;">View &amp; Book Service &rarr;</a>`;
      return reply;
    }

    async function sendAiRequest(text) {
      /* Show the "Matching service..." bubble immediately - resolving the
         browser location can take a moment and may prompt the user. */
      const loadingNode = appendLoading();

      const location = await resolveLocation();

      const body = {
        message: text,
        district: currentUserDistrict || ''
      };

      if (location) {
        body.latitude = location.lat;
        body.longitude = location.lng;
      }

      try {
        const response = await fetch(assistantUrl, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken,
            'Accept': 'application/json'
          },
          credentials: 'same-origin',
          body: JSON.stringify(body)
        });

        const data = await response.json().catch(function() { return {}; });
        removeLoading(loadingNode);

        if (!response.ok) {
          appendMessage('The AI service request could not be completed right now. Please try again.', false);
          return;
        }

        if (!data || !data.success) {
          appendMessage(data && data.message ? data.message : 'Could not find matching service.', false);
          return;
        }

        if (data.type === 'chat' || data.type === 'login_required') {
          appendMessage(data.message || 'I can help you find the right service.', false);
          return;
        }

        const service = data.service;
        if (!service) {
          appendMessage('I could not find a matching service for your request.', false);
          return;
        }

        appendMarkup(buildReplyHtml(service, data.workers || []));
      } catch (error) {
        removeLoading(loadingNode);
        appendMessage('The AI service request could not be completed right now. Please try again.', false);
      }
    }

    async function handleSend() {
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      appendMessage(text, true);

      await sendAiRequest(text);
    }

    sendBtn.addEventListener('click', handleSend);
    input.addEventListener('keypress', function(e) {
      if (e.key === 'Enter') handleSend();
    });

    // Preset query chips
    document.querySelectorAll('.ai-chip-btn').forEach(function(chip) {
      chip.addEventListener('click', function() {
        const query = this.dataset.query;
        if (query) {
          input.value = query;
          handleSend();
        }
      });
    });
  });
  </script>
