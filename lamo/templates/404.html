{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | LAMO</title>
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <style>
        .error-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: #f8fafc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .error-card {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 18px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, .08);
            padding: 44px 36px;
            text-align: center;
        }
        .error-code {
            font-size: 64px;
            font-weight: 800;
            line-height: 1;
            color: #087f5b;
            letter-spacing: -2px;
        }
        .error-title {
            margin: 14px 0 10px;
            font-size: 22px;
            font-weight: 700;
            color: #0f172a;
        }
        .error-text {
            margin: 0 0 26px;
            font-size: 15px;
            line-height: 1.6;
            color: #475467;
        }
        .error-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .error-btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            background: #087f5b;
            color: #ffffff;
            border: 1px solid #087f5b;
        }
        .error-btn.secondary {
            background: #ffffff;
            color: #0f172a;
            border-color: #e2e8f0;
        }
        .error-btn:hover { opacity: .9; }
    </style>
</head>
<body>
    <div class="error-page">
        <div class="error-card">
            <div class="error-code">404</div>
            <h1 class="error-title">We couldn't find that page</h1>
            <p class="error-text">
                The link may be broken or the page may have been moved.
                Try going back to the home page or browsing our services.
            </p>
            <div class="error-actions">
                <a class="error-btn" href="{% url 'home' %}">Back to Home</a>
                <a class="error-btn secondary" href="{% url 'service_list' %}">Browse Services</a>
            </div>
        </div>
    </div>
</body>
</html>
